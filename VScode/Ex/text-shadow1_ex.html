<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>text-transform</title>
  <style>
    h1 {
      font-size: 50px;
      font-family: Arial, Helvetica, sans-serif;
    }
    .shadow1 {
      text-shadow: 1px 1px;
      color: blue;
    }
    .shadow2 {
      text-shadow: 10px 10px 5px #f00;
      color: plum;
    }
    .shadow3 {
      text-shadow: 20px -20px 10px #000000;
      color: yellow;
    }
  </style>
</head>
<body>
	<h1 class="shadow1">HTML5</h1> 
	<h1 class="shadow2">HTML5</h1>
	<h1 class="shadow3">HTML5</h1>
</body> 
</html>
