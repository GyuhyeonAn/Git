<!doctype html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<title>market</title>
	<style>
		#container {
			width: 650px;
			margin: 0 auto; /* 가운데 중앙에 정렬*/
			padding: 5px;
		}
		#check {
			width: 634.5px;
			border: 3px solid #000000;
		}
		h1 {
			color: white;
			font-size: 1em;
			background: #222;
			margin: 0;
			padding: 10px;
			text-align: center;
		}
		h2 {
			text-align: center;
			font-size: 1.2em;
			color: #ff0000;
			font-weight: bold;
		}
		p {
			text-align: center;
			font-size: 0.9em;
			line-height: 1.5em;
			font-weight: bold;
		}
		.accent {
			color: blue;
		}
		.Smalltext {
			font-size: 0.8em;
			font-weight: bold;
		}
	</style>
</head>

<body>
	<div id="container">
		<img src="/VScode/resource/top.jpg" alt="가정용 꿀사과 - 흠집이 있고 약간은 못생겼지만 맛과 영양은 그대로입니다. 질좋은 사과를 저렴하게 즐겨보세요">		
		<div id="check">
			<h1>확인하세요</h1>
			<h2>주문 및 배송</h2>
			<p><span class="accent">오후 2시 이전 </span>주문건은 당일 발송합니다<br>
			2시 이후 주문건은 다음날 발송합니다(주말 제외)</p>
			<hr>
			<h2>교환 및 환불</h2>
			<p>불만족시 100% 환불해 드립니다<br>
			고객센터로 전화주세요</p>
			<hr>
			<h2>고객센터 </h2>
			<p>0000-0000<br>
			<span class="Smalltext">상담시간 : 오전 9시 ~ 오후 6시 (토/일, 공휴일 휴무)</span></p>
		</div>
	</div>
</body>
</html>
