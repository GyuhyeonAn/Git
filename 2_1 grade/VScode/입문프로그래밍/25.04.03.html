<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Tag</title>
    <style>
        ul {
            list-style: none;
        }
    </style>
</head>
<body>
    <form>
        <fieldset>
            <legend>개인정보</legend>
            <ul>
                <li>
                    <label for="name">이름</label>
                    <input type="text" id="name">
                </li>
                <li>
                    <label for="mail">메일 주소</label>
                    <input type="text" id="mail">
                </li>
            </ul>
        </fieldset>
        <fieldset>
        <legend>개인정보</legend>
        <ul>
            <li>
                <label for="id">아이디</label>
                <input type="text" id="id">
            </li>
            <li>
                <label for="pwd">비밀번호</label>
                <input type="text" id="pwd">
            </li>
        </ul>
        </fieldset>
    </form>
    <!--  -->
    <form>
        <fieldset>
            <legend>개인정보</legend>
            <label>아이디 : <input type="text" id="userid" size="15"></label>
            <label>비밀번호 : <input type="password" id="userpwd" size="15"></label>
            <input type="submit" value="로그인">
        </fieldset>
    </form>
    <!--  -->
    <form>
        <fieldset>
            <legend>등록 정보</legend>
                <ul>
                    <li>
                        <label class="reg" for="member">참여 인원<small>(최대10명)</small></label>
                        <input type="member" id="member" value="1" min="0" max="10" step="1">
                    </li>
                    <li>
                        <label class="reg" for="stuffs">지원 물품<small>(최대5명)</small></label>
                        <input type="member" id="stuffs" value="1" min="0" max="50" step="5">
                    </li>
                    <li>
                        <label class="reg" for="satis">희망 단계<small>(상, 중, 하)</small></label>
                        <input type="range" id="satis" value="1" min="1" max="3">
                    </li>
                </ul>
        </fieldset>
    </form>
    <!--  -->
    <form>
        <fieldset>
            <legend>신청과목</legend>
            <p>신청과목 선택</p>
            <label><input type="radio" name="subject" value="s">회화</label>
            <label><input type="radio" name="subject" value="s">문법</label>
            <label><input type="radio" name="subject" value="s">작문</label>
        </fieldset>
        <fieldset>
            <legend>뉴스 주제</legend>
            <p>뉴스 주제를 선택</p>
            <label><input type="checkbox" name="new1" value="n">해외단신</label>
            <label><input type="checkbox" name="new2" value="1">5분회화</label>
            <label><input type="checkbox" name="new3" value="d2">세계경제</label>
        </fieldset>
    </form>
    <!--  -->
    <form>
        <fieldset>
            <legend>색상 선택</legend>
            <p>색상을 선택하세요.</p>
            <label>선호색상 : <input type="color" value="#FFFFFF"></label>
        </fieldset>
    </form>
    <!--  -->
    <form>
        <fieldset>
            <legend>날짜 선택</legend>
            <p>날짜를 선택하세요</p>
            <label>날짜 : <input type="date" id="start"></label>
            <label>날짜 : <input type="date" id="end"></label>
        </fieldset>
    </form>
    <!--  -->
    <form>
        <fieldset>
            <legend>시간 선택</legend>
            <p>시간를 선택하세요</p>
            <label>시간 : <input type="time" value="09:00" id="start1"></label>
            <label>시간 : <input type="time" value="18:00" id="end1"></label>
        </fieldset>
    </form>
    <form>
        <fieldset>
            <legend>학과 선택</legend>
            <select id="class">
                <optgroup label="공과대학">
                    <option value="t1">건축공학과</option>
                    <option value="t2">컴퓨터공학과</option>
                    <option value="t3">환경공학과</option>
                    <option value="t4">전자공학과</option>
                </optgroup>
                <optgroup label="인문대학">
                    <option label="사학과"></option>
                    <option label="어문학과"></option>
                    <option label="철학과"></option>
                </optgroup>
            </select>
        </fieldset>
    </form>
</body>
</html>
