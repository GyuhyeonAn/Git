<body>
    <h1>블루베리 향산화 효능</h1>
    <p style="color: red;"><div>
        입문프로그래밍언어 코딩중입니다.</div></p>
    <p>
    <p>문법의 인라인 적용입니다.</p>
    
    <p>div태그 사용</p>
    <p>입문프로그래밍언어<div style="color: blue;">코딩</div>중입니다.</p>
    <p>입문프로그래밍언어<span style="color: blue;">코딩</span>중입니다.</p>
