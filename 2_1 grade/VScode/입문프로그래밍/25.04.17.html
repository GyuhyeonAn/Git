<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text style</title>
    <style>
        .container {
            width: 500px;
            padding: 10px;
            border: 3px solid #000000;
        }
        .subject {
            font-weight: 700;
            font-size: larger;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>최신 웹 디자인 트랜드</h1>
        <p><span class="subject">반응형 웹 디자인 </span> - 다양한 화면 크기에 최적화하다</p>
        <p><span class="subject">플랫 디자인 </span>- 업체에서 평면으로</p>
        <p><span class="subject">풀 스크린 배경 </span>- 콘텐츠에 집중</p>
        <p><span class="subject">원 페이지 사이트 </span>- 한 페이지에 모든 내용을 담다</p>
        <p><span class="subject">패럴렉스 스크롤링 </span>- 동적인 효과로 강한 인상을!</p>
        <p><span class="subject">웹 폰트 </span>- 웹 타이포그래피를 받쳐주는 기술</p>

    </div>
</body>
</html>
